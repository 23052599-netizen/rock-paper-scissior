<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Rock Paper Scissors</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <h1>Rock-Paper-Scissors Game</h1>

    <div class="choices">
        <img src="./image/rock.png" alt="Rock" id="rock" class="choice">
        <img src="./image/paper.png" alt="Paper" id="paper" class="choice">
        <img src="./image/scisior.png" alt="Scissors" id="scissors" class="choice">
    </div>

    <div class="score-board">
        <div class="score">
            <p id="user-score">0</p>
            <p>User</p>
        </div>

        <div class="score">
            <p id="computer-score">0</p>
            <p>Computer</p>
        </div>
    </div>

    <div class="msg-container">
        <p id="message">Make your move!</p>
    </div>

    <script src="hand.js"></script>
</body>
</html>
